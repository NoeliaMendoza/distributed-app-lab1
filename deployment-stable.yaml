apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: distributed-app
      track: stable
  template:
    metadata:
      labels:
        app: distributed-app
        track: stable
    spec:
      containers:
        - name: distributed-app
          image: distributed-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
